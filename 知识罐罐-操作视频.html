<!doctype html>
<html lang="zh-CN">
<head>

  <title>知识罐罐 · 操作视频</title>
  <style>
    :root { --paper:#fbf5e8; --ink:#2f2923; --green:#4f6f52; --line:#d9c8ad; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; background:linear-gradient(135deg,#f8efdf,#fbf5e8 55%,#f4ead8); }
    .wrap { width:min(1080px,calc(100% - 32px)); margin:0 auto; padding:34px 0 46px; }

    .head { margin:28px 0 18px; display:flex; justify-content:space-between; align-items:end; gap:20px; }

    .head p { margin:0; color:#756858; font-size:14px; line-height:1.7; }
    .player { padding:14px; border:2px solid var(--ink); border-radius:24px; background:#211b17; box-shadow:0 20px 44px rgba(47,41,35,.18); }
    video { display:block; width:100%; max-height:76vh; border-radius:15px; background:#000; }
    .meta { margin-top:18px; padding:18px 20px; border:1.5px dashed var(--line); border-radius:18px; color:#756858; line-height:1.8; font-size:14px; background:rgba(255,253,247,.72); }
    .meta strong { color:var(--ink); }
    @media (max-width:700px){ .head{display:block}.head p{margin-top:8px}.wrap{padding-top:20px} }

</head>
<body>
  <main class="wrap">
    <a class="back" href="./知识罐罐-作品集汇总.html">← 返回作品集汇总</a>
